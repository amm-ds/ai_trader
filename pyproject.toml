[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trader"
version = "0.1.0"
description = "Causal, risk-first research infrastructure for systematic futures trading"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "ai_trader contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "pyarrow>=14,<24",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]
# Optional tabular baseline; the deterministic P1 ensemble does not require it.
ml = ["lightgbm>=4,<5", "scikit-learn>=1.5,<2"]
# dl = []
# rl = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_trader = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["ai_trader"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
